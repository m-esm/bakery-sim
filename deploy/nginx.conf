# Tiny Bakery static site behind nginx-unprivileged (port 8080, uid 101).
# Compatible with a read-only root filesystem when emptyDirs are mounted at
# /tmp, /var/cache/nginx, and /var/run (cluster mounts those paths).

server {
  listen 8080;
  server_name bakery.moshes.io _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  absolute_redirect off;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 256;
  gzip_vary on;
  gzip_proxied any;
  gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/wasm
    image/svg+xml
    font/ttf
    font/otf
    application/octet-stream
    model/gltf-binary;

  # Hashed Vite bundles: long cache
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # GLB and other static models from public/models
  location /models/ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    types {
      model/gltf-binary glb;
      application/octet-stream bin;
    }
    try_files $uri =404;
  }

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  # SPA shell: no long cache so deploys pick up new index.html
  location = /index.html {
    add_header Cache-Control "no-cache";
    try_files /index.html =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
